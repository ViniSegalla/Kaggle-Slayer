# Boosting is included in the default installation and roster.
# Retained as an explicit run-profile example; no longer required to enable these models.
# uv run python -m kaggle_slayer run --competition titanic --config configs/boosting.yaml --no-submit
models: [linear, random_forest, lightgbm, catboost, xgboost]
max_experiments: 10
max_iterations: 3
optuna_trials: 2
max_seconds: 1800
