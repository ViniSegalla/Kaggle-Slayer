execution_mode: agentic
# Allowed families, not a mandatory queue. One family/experiment is valid in this mode.
models: [linear, random_forest, hist_gradient, lightgbm, xgboost, catboost]
max_experiments: 8
max_seconds: 1800
experiment_timeout: 180
n_jobs: 2
folds: 5
max_llm_requests: 80
max_llm_tokens: 1000000
max_llm_context_bytes: 65536
max_agent_turns: 80
max_delegation_depth: 2
agent_concurrency: 2
max_action_repeats: 2
max_invalid_actions: 4
# Capability limits; no slots are reserved automatically.
max_iterations: 3
optuna_trials: 2
ensemble: true
confirmation_top_k: 2
submit: false
