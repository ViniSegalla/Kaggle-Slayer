name: Quality and offline integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --extra dev
      - run: uv run --locked ruff check src tests dashboard scripts examples
      - run: uv run --locked ruff format --check src tests dashboard scripts examples
      - run: uv run --locked pytest --junitxml=artifacts/test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence-${{ matrix.os }}
          path: artifacts/test-results.xml
